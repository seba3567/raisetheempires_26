name: Start PostgreSQL
description: >
  Start the PostgreSQL server the runner image already has installed and give
  the postgres role a password, so the tests can reach it over TCP.

  The runner image ships PostgreSQL 18.6 -- the version this project targets
  -- with the service installed but disabled by default. Starting it from
  here keeps the workflow free of any container runtime.

runs:
  using: composite
  steps:
    - name: Start the server
      shell: bash
      run: |
        sudo systemctl start postgresql.service
        sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"

        # The service can take a moment to accept connections after systemd
        # reports it as started, so wait for the port rather than trusting the
        # first attempt.
        for attempt in $(seq 1 30); do
          if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
            echo "PostgreSQL is ready."
            exit 0
          fi
          sleep 1
        done

        echo "::error::PostgreSQL did not become ready on 127.0.0.1:5432"
        exit 1
