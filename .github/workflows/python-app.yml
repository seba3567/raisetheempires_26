# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Build & Release Python application

permissions:
  contents: write
  pull-requests: write
  issues: write
on:
  push:
  pull_request:

jobs:
  run_web_tests:
    name: Test and Check SvelteKit Frontend
    runs-on: ubuntu-latest
    env:
      # The suite builds its own database from this URL, so it only has to
      # point at a reachable server. Without one, every test that touches the
      # database fails on the connection.
      RTE_TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/rte_web_test
    steps:
    - uses: actions/checkout@v5
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - name: Start PostgreSQL
      uses: ./.github/actions/start-postgresql
    - name: Install web dependencies
      working-directory: web
      run: bun install --frozen-lockfile
    - name: Check types with svelte-check
      working-directory: web
      run: bun run check
    - name: Build the front door
      # A build break used to pass this job: it checked the types and ran the
      # tests, but never produced the bundle. A missing module or a bad adapter
      # option only shows up when the thing is built.
      working-directory: web
      run: bun run --bun build
    - name: Run unit & integration tests
      working-directory: web
      run: bun test

  web_smoke:
    # The job that builds the front door and talks to it.
    #
    # Every other job drives the two runtimes in process, which means the
    # wiring between them was never exercised: the port the server binds, the
    # origin compiled into the build and the `Host` header the proxy sends
    # upstream are three separate things that have to agree, and nothing
    # checked that they did.
    #
    # They disagreed once. The front door bound port 3000 while the build baked
    # http://localhost:8080, the Bun adapter rewrote every request onto that
    # baked origin, and SvelteKit refused every form POST as a cross-site
    # submission: the login answered 403 while every page loaded normally. The
    # unit tests could not see it, because they never load the configuration
    # and never start the server.
    name: Build the front door and talk to it
    runs-on: ubuntu-latest
    env:
      # The server builds its own database from this URL.
      RTE_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/raisetheempires
      RTE_DB_NAME: raisetheempires
      SESSION_SECRET: ci-secret-not-for-production
      PORT: 8080
      HOST: 127.0.0.1
      PUBLIC_ORIGIN: http://localhost:8080
      GATEWAY_ORIGIN: http://127.0.0.1:5005
    steps:
    - uses: actions/checkout@v5
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - name: Start PostgreSQL
      uses: ./.github/actions/start-postgresql
    - name: Install web dependencies
      working-directory: web
      run: bun install --frozen-lockfile
    - name: Build the front door
      working-directory: web
      run: bun run --bun build
    - name: Start the front door
      working-directory: web
      run: |
        bun ./build > web.log 2>&1 &
        echo "WEB_PID=$!" >> $GITHUB_ENV
    - name: Wait for it to answer
      run: |
        for attempt in $(seq 1 60); do
          if curl -fsS -o /dev/null http://127.0.0.1:8080/; then
            echo "the front door answered after ${attempt}s"
            exit 0
          fi
          if ! kill -0 "$WEB_PID" 2>/dev/null; then
            echo "::error::the front door exited during startup"
            cat web/web.log
            exit 1
          fi
          sleep 1
        done
        echo "::error::the front door never answered"
        cat web/web.log
        exit 1
    - name: The front door does not refuse its own login
      run: |
        # A form POST whose Origin is not the one compiled into the build is
        # refused with 403 "Cross-site POST form submissions are forbidden".
        # The status here has to be anything but 403: the credentials are
        # wrong on purpose, so the honest answer is 401.
        status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/entrar \
          -H 'Origin: http://localhost:8080' \
          -H 'Content-Type: application/x-www-form-urlencoded' \
          --data 'username=nobody&password=nobody')
        echo "POST /entrar -> $status"
        if [ "$status" = "403" ]; then
          echo "::error::the front door refuses its own login: the origin it was built with and the origin it serves disagree"
          exit 1
        fi
    - name: Front door log
      if: always()
      run: cat web/web.log
    - name: Stop the front door
      if: always()
      run: kill "$WEB_PID" 2>/dev/null || true

  run_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      # The gateway suite points at its own database, and the save store's
      # tests at another, so a run never wipes the tables the other is using.
      RTE_TEST_DB: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/rte_gateway_test
      RTE_PG_TEST_URL: postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/rte_savestore_test
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Start PostgreSQL
      uses: ./.github/actions/start-postgresql

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: ruff check .

    - name: Type-check with mypy
      run: mypy

    - name: Test with pytest
      run: pytest -rPA -vv --junitxml=test-results.xml --cov=. --cov-report=xml

    - name: Display structure of files
      if: always()
      run: ls -laR

    - name: Publish test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
       name: pytest-results
       path: test-results.xml

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-xml
        path: .coverage
        include-hidden-files: true

    - name: Surface failing tests
      if: always()
      uses: pmeier/pytest-results-action@main
      with:
        # A list of JUnit XML files, directories containing the former, and wildcard
        # patterns to process.
        # See @actions/glob for supported patterns.
        path: test-results.xml
        # (Optional) Add a summary of the results at the top of the report
        summary: true
        # (Optional) Select which results should be included in the report.
        # Follows the same syntax as `pytest -r`
        display-options: fEX
        # (Optional) Fail the workflow if no JUnit XML was found.
        fail-on-empty: true
        # (Optional) Title of the test results section in the workflow summary
        title: Test results
  gateway_smoke:
    # The one job that starts the thing.
    #
    # Every other job here builds the app or drives it in process, which means
    # serve.py, wsgi.py, configure_app() and the __main__ block had no coverage
    # at all -- and that is where four bugs shipped in a row. __main__ calls
    # serve(); serve() had no import and the gateway died with a NameError on
    # startup, and 190 passing tests never noticed, because test/conftest.py
    # builds the app through importlib and never runs __main__.
    #
    # check_gateway.py then talks to it over a real socket: HTTP, an AMF call,
    # and the routes the front end depends on. That is the only way to catch a
    # failure in the startup path, so it runs on every push rather than only
    # when someone remembers to boot the server by hand.
    name: Boot the gateway and talk to it
    runs-on: ubuntu-latest
    env:
      # The gateway keeps its saves in PostgreSQL and builds the store while
      # the app is configured, so it cannot start without a server: with an
      # unreachable one it dies in configure_app() with an OperationalError
      # before it ever binds a port.
      # The canonical name, the same one the web front door reads. The gateway
      # used to call this SAVE_STORE_PATH and the front door RTE_DB_URL, and
      # a deployment that set one of each pair pointed the two halves at
      # different databases.
      RTE_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/raisetheempires
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Start PostgreSQL
      uses: ./.github/actions/start-postgresql

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Start the gateway
      run: |
        python empires-server.py --port 5005 --no-popup > gateway.log 2>&1 &
        echo "GATEWAY_PID=$!" >> $GITHUB_ENV

    - name: Wait for it to answer
      run: |
        # The catalogue is 13 MB and there are 1663 quests, so first boot is a
        # couple of seconds even on a warm runner. Anything under three minutes
        # is a hang, not a slow start.
        for attempt in $(seq 1 180); do
          if curl -fsS -o /dev/null "http://127.0.0.1:5005/list_session"; then
            echo "gateway answered after ${attempt}s"
            exit 0
          fi
          if ! kill -0 "$GATEWAY_PID" 2>/dev/null; then
            echo "::error::the gateway exited during startup"
            cat gateway.log
            exit 1
          fi
          sleep 1
        done
        echo "::error::the gateway never answered"
        cat gateway.log
        exit 1

    - name: Check the seams over a real socket
      env:
        RTE_PROBE_PORT: 5005
      run: python check_gateway.py

    - name: Gateway log
      if: always()
      run: cat gateway.log

    - name: Stop the gateway
      if: always()
      run: kill "$GATEWAY_PID" 2>/dev/null || true

  coverage:
    runs-on: ubuntu-latest
    needs: run_tests
    if: '!cancelled()'
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # This is optional since by default it's to true. The git
          # operations in python-coverage-comment-action utilize the token
          # stored by actions/checkout.
          persist-credentials: true

      - uses: actions/download-artifact@v5
        id: download
        with:
          name: coverage-xml
          #path: coverage

      - name: Display structure of downloaded files
        run: ls -laR .

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        #  COVERAGE_PATH: coverage

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt

  build_windows_x64:
    runs-on: windows-latest
    needs: run_tests
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: build exe
        run: |
          pip install ".[build]"
                    copy build-tools\empires-server.spec . 
          pyinstaller empires-server.spec --distpath dist_mini_x64 --clean

      - name: Display structure of files
        if: always()
        run: dir

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary_windows_x64
          path: dist_mini_x64\empires-server.exe
          include-hidden-files: true


  build_windows_x86:
    runs-on: windows-latest
    needs: run_tests
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x86"

      - name: build exe
        run: |
          pip install ".[build]"
                    copy build-tools\empires-server.spec . 
          pyinstaller empires-server.spec --distpath dist_mini_x86 --clean

      - name: Display structure of files
        if: always()
        run: dir

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary_windows_x86
          path: dist_mini_x86\empires-server.exe
          include-hidden-files: true

  inno_setup:
    name: Build the Inno Setup Installer
    needs:
      - build_windows_x64
      - build_windows_x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up workspace
        run: |
          copy build-tools\empires_inno_setup.iss .
          rmdir /s /q assets\sol_assets_old
          rmdir /s /q assets\sol_assets_dict1_only
          rmdir /s /q assets\sol_assets_unknown
        shell: cmd

      - uses: actions/download-artifact@v5
        id: download_x64
        with:
          name: binary_windows_x64
          path: dist_mini_x64

      - uses: actions/download-artifact@v5
        id: download_x86
        with:
          name: binary_windows_x86
          path: dist_mini_x86

      - name: Download Chromium 82 x86
        run: |
          mkdir chromium_x86
          curl -L -o chromium_x86.zip https://commondatastorage.googleapis.com/chromium-browser-snapshots/Win/740177/chrome-win.zip
          unzip chromium_x86.zip -d chromium_x86
        shell: bash

      - name: Download Chromium 82 x64
        run: |
          mkdir chromium_x64
          curl -L -o chromium_x64.zip https://commondatastorage.googleapis.com/chromium-browser-snapshots/Win_x64/740173/chrome-win.zip
          unzip chromium_x64.zip -d chromium_x64
        shell: bash

      - name: Compile .ISS to .EXE Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: empires_inno_setup.iss
          #options: /O+
      - name: Display structure of files
        if: always()
        run: dir
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary_windows_installer
          path: empires-installer\empires-setup.exe
          include-hidden-files: true

  create_release:
    name: Create Release
    needs: inno_setup
    # if: !always()
    #if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        id: download_installer
        with:
          name: binary_windows_installer
          path: setup

      - name: Detect branch
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          CURRENT_TAG="$(git tag --points-at HEAD | head -n 1)"
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          [[ "$CURRENT_TAG" =~ ^[0-9]+\.[0-9]+(a|b)?$ ]] && TAG_SEMANTIC_RELEASE=true || TAG_SEMANTIC_RELEASE=false
          echo "TAG_SEMANTIC_RELEASE=$TAG_SEMANTIC_RELEASE" >> $GITHUB_ENV

      - name: Do release checks
        if: env.TAG_SEMANTIC_RELEASE == true
        run: |
          VERSION=$(grep "version =" empires-server.py  | sed -E 's/^.*\"(.*)\".*$/\1/')
          if [ -z "$VERSION"]; then
            echo No version found in empires-server.py
            echo Fix your error, remove the tag on this commit and retag the new commit with the release number
            exit 1
          fi
          if [ "$CURRENT_TAG" != "$VERSION" ]; then
            echo Version $VERSION in empires-server.py does not match the current tag $CURRENT_TAG, no date should be added to a full release version
            echo Fix your error, remove the tag on this commit and retag the new commit with the release number
            exit 1
          fi
          if gh release view "$CURRENT_TAG" >/dev/null 2>&1; then
              echo "Release with tag $CURRENT_TAG already exists."
              echo Fix your error, see why this tag is triggered again (did you force push it?)
              exit 1
          else
              echo "No release $CURRENT_TAG exists, release can continue."
          fi
           if [ ! -f "build-tools/.${CURRENT_TAG}-release-snippet.md" ]; then
              echo Make a build-tools/.${CURRENT_TAG}-release-snippet.md for this release 
              echo Fix your error, remove the tag on this commit and retag the new commit with the release number
              exit 1
          fi 

      - name: Post PR preview comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
      
            const body = `
            :rocket: 🦇 **Feature preview build for this pull request** :fire_engine:
            
            Test your installer, in some cases errors can happen that only happen installed. 

            BACKUP your saves! Feature previews might even be more unstable than Nightly releases, it may or may not corrupt your saves.           
            
            **PR:** #${pr.number} – ${pr.title}
            **Branch:** \`${pr.head.ref}\`
            **Commit:** \`${context.sha.substring(0, 8)}\`
            
            ### Download
            **[Download the installer from here](${runUrl})**
            
            Builds might get pruned after a time
            `;

            // Find existing comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });
    
            const botComment = comments.data.find(c =>
              c.user.type === "Bot" &&
              c.body.includes("Feature preview build for this pull request")
            );
      
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            }


      - name: Delete existing nightly release
        if: github.event_name == 'push' && (env.BRANCH == 'main' || env.BRANCH == 'master') && env.TAG_SEMANTIC_RELEASE != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly -y || true
          

      - name: Delete existing preview branch release
        if: github.event_name == 'push' && (env.BRANCH != 'main' && env.BRANCH != 'master') && env.TAG_SEMANTIC_RELEASE != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete preview-${BRANCH} -y || true
          PREVIEW_TAG="preview-${BRANCH}"
          

      - name: Update nightly tag (main only)
        if:  github.event_name == 'push' && (env.BRANCH == 'main' || env.BRANCH == 'master') && env.TAG_SEMANTIC_RELEASE != true
        run: |
          git tag -f nightly
          git push origin nightly --force
      

      - name: Update preview tag
        if:  github.event_name == 'push' && (env.BRANCH != 'main' && env.BRANCH != 'master') && env.TAG_SEMANTIC_RELEASE != true
        run: |
          PREVIEW_TAG="preview-${BRANCH}"
          echo "PREVIEW_TAG=$PREVIEW_TAG" >> $GITHUB_ENV
          git tag -f "$PREVIEW_TAG"
          git push origin "$PREVIEW_TAG" --force


      - name: Create full release notes
        if:  github.event_name == 'push' && (env.BRANCH == 'main' || env.BRANCH == 'master') && env.TAG_SEMANTIC_RELEASE == true
        run: |
          PREV_TAG=$(git tag --list '[0-9].[0-9][0-9]*' -q-sort=-version:refname | head -n 1)
          VERSION=$(grep "version =" empires-server.py  | sed -E 's/^.*\"(.*)\".*$/\1/')
          CHANGES=$(git log "$PREV_TAG"..HEAD \
            --no-merges \
            --pretty=format:'- %s (%an)')
          SNIPPET=$(cat build-tools/.${CURRENT_TAG}-release-snippet.md)
          sed \
            -e "s|{{VERSION}}|$VERSION/|" \
            -e "s|{{PREV_TAG}}|$PREV_TAG|g" \
            -e "s|{{SHA}}|${GITHUB_SHA::8}|g" \
            -e "s|{{BRANCH}}|$BRANCH|g" \
            build-tools/.release-notes.md > build-tools/.release-notes-tmp.md
          
          awk -v changes="$CHANGES" '
            BEGIN {
              gsub(/&/, "\\\\&", changes)
            }
            { 
              sub(/{{CHANGES}}/, changes)
              IGNORECASE = 1
              $0 = gensub(/(\154\157\163\163.*)\(/, "\\1~~:.|:;~~ :window: \(", "1")
              print
            }
            ' build-tools/.release-notes-tmp.md > build-tools/.release-notes-tmp2.md 
          
          gawk -v snippet="SNIPPET" '
            BEGIN {
              gsub(/&/, "\\\\&", snippet)
            }
            { 
              sub(/{{SNIPPET}}/, snippet)
              print
            }
            ' build-tools/.release-notes-tmp2.md > release-notes.md
          rm build-tools/.release-notes-tmp.md
          rm build-tools/.release-notes-tmp2.md

      - name: Create nightly release notes
        if:  github.event_name == 'push' && (env.BRANCH == 'main' || env.BRANCH == 'master')  && env.TAG_SEMANTIC_RELEASE != true
        run: |
          PREV_TAG=$(git tag --list '[0-9].[0-9][0-9]*' --sort=-version:refname | head -n 1)
          VERSION=$(grep "version =" empires-server.py  | sed -E 's/^.*\"(.*)\".*$/\1/')
          VERSION_DATE=$(echo $VERSION | sed -nE 's/^.*([0-9]{4}_[0-9]{2}_[0-9]{2}).*$/\1/p')
          COMMIT_DATE=$(git show -s --format=%cd --date=format:%Y_%m_%d)
          if [ -n "$VERSION_DATE" ] && [ "$VERSION_DATE" != "$COMMIT_DATE" ]; then
            VERSION="${VERSION}_commit_date_${COMMIT_DATE}"
          fi
          CHANGES=$(git log "$PREV_TAG"..HEAD \
            --no-merges \
            --pretty=format:'- %s (%an)')
          sed \
            -e "s|{{VERSION}}|$VERSION/|" \
            -e "s|{{PREV_TAG}}|$PREV_TAG|g" \
            -e "s|{{SHA}}|${GITHUB_SHA::8}|g" \
            -e "s|{{BRANCH}}|$BRANCH|g" \
            build-tools/.nightly-release-notes.md > build-tools/.nightly-release-notes-tmp.md
          
          gawk -v changes="$CHANGES" '
            BEGIN {
              gsub(/&/, "\\\\&", changes)
            }
            { 
              sub(/{{CHANGES}}/, changes)
              IGNORECASE = 1
              $0 = gensub(/(\154\157\163\163.*)\(/, "\\1~~:.|:;~~ :window: \(", "1")
              print
            }
            ' build-tools/.nightly-release-notes-tmp.md > nightly-release-notes.md
          rm build-tools/.nightly-release-notes-tmp.md


      - name: Create preview branch release notes
        if:  github.event_name == 'push' && (env.BRANCH != 'main' && env.BRANCH != 'master')  && env.TAG_SEMANTIC_RELEASE != true
        run: |
          PREV_TAG=$(git tag --list '[0-9].[0-9][0-9]*' --sort=-version:refname | head -n 1)
          VERSION=$(grep "version =" empires-server.py  | sed -E 's/^.*\"(.*)\".*$/\1/')
          VERSION_DATE=$(echo $VERSION | sed -nE 's/^.*([0-9]{4}_[0-9]{2}_[0-9]{2}).*$/\1/p')
          COMMIT_DATE=$(git show -s --format=%cd --date=format:%Y_%m_%d)
          if [ -n "$VERSION_DATE" ] && [ "$VERSION_DATE" != "$COMMIT_DATE" ]; then
            VERSION="${VERSION}_commit_date_${COMMIT_DATE}"
          fi
          CHANGES=$(git log "$PREV_TAG"..HEAD \
            --no-merges \
            --pretty=format:'- %s (%an)')
                   sed \
            -e "s|{{VERSION}}|$VERSION/|" \
            -e "s|{{PREV_TAG}}|$PREV_TAG|g" \
            -e "s|{{SHA}}|${GITHUB_SHA::8}|g" \
            -e "s|{{BRANCH}}|$BRANCH|g" \
            build-tools/.preview-release-notes.md > build-tools/.preview-release-notes-tmp.md
          
          gawk -v changes="$CHANGES" '
            BEGIN {
              gsub(/&/, "\\\\&", changes)
            }
            { 
              sub(/{{CHANGES}}/, changes)
              IGNORECASE = 1
              $0 = gensub(/(\154\157\163\163.*)\(/, "\\1~~:.|:;~~ :window: \(", "1")
              print
            }
            ' build-tools/.preview-release-notes-tmp.md > preview-release-notes.md
          rm build-tools/.preview-release-notes-tmp.md

              

      - name: Create full release draft
        if: github.event_name == 'push' && (env.BRANCH == 'main' || env.BRANCH == 'master') && env.TAG_SEMANTIC_RELEASE == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $CURRENT_TAG ./setup/empires-setup.exe \
            --title "$VERSION" \
            --notes-file release-notes.md \
            --draft   

      - name: Create nightly release
        if: github.event_name == 'push' && (env.BRANCH == 'main' || env.BRANCH == 'master')  && env.TAG_SEMANTIC_RELEASE != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create nightly ./setup/empires-setup.exe \
            --title "Nightly ${GITHUB_SHA::8}" \
            --notes-file nightly-release-notes.md \
            --prerelease    

      - name: Create preview branch release
        if: github.event_name == 'push' && (env.BRANCH != 'main' && env.BRANCH != 'master')  && env.TAG_SEMANTIC_RELEASE != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create $PREVIEW_TAG ./setup/empires-setup.exe \
            --title "Preview branch release ${GITHUB_SHA::8}" \
            --notes-file preview-release-notes.md \
            --prerelease
                

