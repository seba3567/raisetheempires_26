[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "raise-the-empires"
version = "0.8.1"
description = "Preservation project for the Flash game Empires & Allies (closed 2013)"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "The Raise the Empires team" }]
keywords = ["empires-and-allies", "preservation", "flash", "game-server"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Real Time Strategy",
]

# Lower bounds with an upper cap at the next major, so a fresh install gets the
# current release while a major bump is always a deliberate decision.
dependencies = [
    "flask>=3.1.1,<4",
    "werkzeug>=3.1.5,<4",
    "itsdangerous>=2.2,<3",
    "jinja2>=3.1.6,<4",
    "flask-session>=0.8,<1",
    "flask-sqlalchemy>=3.1.1,<4",
    "flask-compress>=1.17,<2",
    "flask-socketio>=5.5,<6",
    "sqlalchemy>=2.0.38,<3",
    "msgspec>=0.20,<1",
    "tendo>=0.3,<1",
    "daiquiri>=3.2.5.1,<4",
    "python-editor>=1.0.4,<2",
    "xmldiff>=2.7,<4",
    "jsonpatch>=1.33,<2",
    "py3amf>=0.8.10,<1",
    "tqdm>=4.67.1,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-cov>=6",
    "ruff>=0.17",
    "mypy>=1.11",
    "coverage>=7.6",
]
build = [
    "pyinstaller>=6.17",
    "setuptools>=77",
    "wheel>=0.45",
]

[project.urls]
Homepage = "https://github.com/AcidCaos/raisetheempires"
Source = "https://github.com/AcidCaos/raisetheempires"
Issues = "https://github.com/AcidCaos/raisetheempires/issues"

[tool.setuptools]
# The project is a flat set of top-level scripts, not an importable package.
py-modules = [
    "battle_engine",
    "crc64_go_iso",
    "game_settings",
    "init_settings",
    "language_settings",
    "logger",
    "mod_engine",
    "quest_engine",
    "quest_settings",
    "save_engine",
    "save_migration",
    "state_machine",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["test"]
# Legacy naming: the suite uses *_test.py, not test_*.py.
python_files = ["*_test.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "default",
    # pyamf (py3amf) is the AMF codec for the original Flash client and is
    # unmaintained; it is the main source of DeprecationWarnings.
    "ignore::DeprecationWarning:pyamf.*",
    "ignore::DeprecationWarning:defusedxml.*",
]

[tool.ruff]
target-version = "py311"
line-length = 120
# Keep new violations from failing CI on day one; tighten over time.
fix = false
exclude = [
    "assets",
    "build",
    "dist*",
    "redist",
    "templates",
]

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
]
ignore = [
    # Star imports are load-bearing in empires-server.py: `datetime`, `session`
    # and a large part of the quest API reach the module only through them.
    # Removing them is a separate refactor, tracked separately.
    "F403",
    "F405",
    # Same origin as F403/F405.
    "E402",
    # Long lines inherited from the AMF/Flash response payloads.
    "E501",
    # Deliberate print() logging is how this project reports state.
    "T201",
    "T203",

    # ---- Deferred to phase 2: high-churn, low-signal rules -------------------
    # pathlib migration (PTH*): real modernisation, but it rewrites ~70 call
    # sites across the engines and needs its own review pass.
    "PTH",
    # Collapsing same-arm if/elif chains touches 127 blocks and risks changing
    # which branch wins under short-circuit evaluation.
    "SIM114",
    # "Assign then immediately return" cleanup, purely cosmetic.
    "RET504",
    # list + list -> [*a, *b]; sometimes deliberate for a small memory profile.
    "RUF005",
    # dict.get() rewrites around 12 call sites.
    "SIM401",
    # zip(strict=...): adding strict=True can turn a silently-truncating zip into
    # a crash. Needs per-call review, not a blanket autofix.
    "B905",
    # Dead local variables: often debug leftovers kept for context. Worth a
    # deliberate pass, not a mechanical one.
    "F841",
    # `next(iterable)` over `[...][0]` swaps IndexError for StopIteration, which
    # PEP 479 turns into a RuntimeError if it ever escapes inside a generator.
    "RUF015",

    # ---- Accepted for this codebase, with reasons ---------------------------
    # A game server must keep serving even when one corrupt save or one missing
    # cache entry blows up; swallowing the exception and continuing is the intent.
    "BLE001",
    # `raise ValueError` re-raises the exception that is already being handled,
    # which is the behaviour the log messages are written around.
    "TRY201",
    # Raising the builtin LookupError/ValueError family is intentional here.
    "TRY002",
    # Iterating a dict and looking values up by key (used for de-duplication and
    # "is this key present" checks).
    "PLC0206",
    # Typographic characters are intentional in user-facing strings.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Tests are allowed to be long, use bare asserts and import oddly-named modules.
"test/*" = ["E501", "B011", "SIM117", "PLC0415", "F401", "B006", "RUF059"]
"empires-server.py" = ["E402", "F403", "F405", "E501", "B008", "SIM102"]

[tool.ruff.lint.isort]
known-first-party = ["battle_engine", "game_settings", "mod_engine", "quest_engine", "save_engine", "state_machine"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["battle_engine.py", "crc64_go_iso.py", "game_settings.py", "mod_engine.py", "quest_engine.py",
         "save_engine.py", "save_migration.py", "state_machine.py", "init_settings.py", "logger.py"]
# Baseline: the codebase is dynamically typed and talks to Flask sessions,
# SQLAlchemy models and pyamf objects. Start permissive and tighten per module.
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_optional = true
strict_equality = false
ignore_missing_imports = true
exclude = "(^|/)(assets|build|dist|redist|templates)/"
# The engines are schema-less: JSON/msgpack payloads arrive as plain dicts and
# lists and are indexed by keys mypy cannot see. These codes fire on that
# dynamic access rather than on real defects; they are re-enabled per module as
# the engines gain type hints.
disable_error_code = [
    "var-annotated",     # empty containers with no inferable element type
    "misc",              # "None is not callable" on pluggable providers
    "attr-defined",      # Flask's SessionMixin duck-typing (session.sid, ...)
    "call-overload",     # dict/list indexed by a dynamically built key
    "union-attr",        # Optional payloads narrowed by runtime validation
    "assignment",        # numeric widening inside battle math
    "arg-type",          # values coming straight from decoded AMF/JSON
]

# New code is held to a higher standard than the legacy engines.
[[tool.mypy.overrides]]
module = ["crc64_go_iso"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
strict_equality = true

[tool.coverage.run]
relative_files = true
source = ["."]

[tool.coverage.report]
omit = ["test/*", "build/*", "dist*/*", "redist/*", "templates/*"]