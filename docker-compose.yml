version: "3.9"

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raisetheempires
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      RTE_DB_URL: postgres://postgres:postgres@postgres:5432/raisetheempires
      GATEWAY_ORIGIN: http://gateway:5005
    ports:
      - "5005:5005"
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      GATEWAY_ORIGIN: http://gateway:5005
      PUBLIC_ORIGIN: http://localhost:8080
      RTE_DB_URL: postgres://postgres:postgres@postgres:5432/raisetheempires
      SESSION_SECRET: "change-me-in-production"
    ports:
      - "8080:8080"
    depends_on:
      - gateway
      - postgres

volumes:
  pgdata: